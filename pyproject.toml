[project]
name = "boletin-semestral"
version = "0.1.0"
description = "Boletín semestral «Proyección Social EN ACCIÓN» — Facultad de Ingenierías y Ciencias Básicas, CUE Alexander von Humboldt"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "jinja2>=3.1",
    "pillow>=11",
    "playwright>=1.49",
    "segno>=1.6",
    "tomli-w>=1.1",
    "anthropic>=1.5.0",
]

[project.scripts]
semestral = "boletin_semestral.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "selectolax>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boletin_semestral"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Ruff formatea el Python embebido en Markdown: sin esta exclusión reescribiría el plan y el spec.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

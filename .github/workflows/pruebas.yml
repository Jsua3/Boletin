name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --dev

      - name: Estilo
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Las pruebas de PDF se saltan: aquí no se instala Chromium (spec §9).
      - name: Pruebas
        run: uv run pytest -q
